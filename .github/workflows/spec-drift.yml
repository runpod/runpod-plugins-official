name: spec-drift

# The snapshot-backed checks in `validate` gate what a PR changed and nothing else.
# This job runs the same checks against the *live* API and the latest runpodctl
# release, which is the only way to notice that upstream moved under us. It is
# deliberately separate and non-blocking: an upstream change is real news, but it is
# not a reason to fail an unrelated PR.
#
# The runpodctl half exists because a release has twice falsified "the CLI cannot do
# X" claims in the skills (v2.9.0 -> `serverless health`, v2.10.0 -> `serverless logs`).
# The runpod-mcp half exists because renamed MCP tools have outlived their rename in
# the docs.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Refresh the vendored snapshot from the live spec
        run: |
          curl -sSf https://api.runpod.io/v2/openapi.json \
            -o testdata/runpod-migrate/v2-openapi.json
      - name: Report snapshot drift
        run: git --no-pager diff --stat -- testdata/runpod-migrate/v2-openapi.json
      - name: Path tables vs. live spec
        run: python3 hooks/check_migrate_tables.py --live
      - name: Class-3 table vs. live spec
        run: python3 hooks/check_migrate_class3.py --live
      - name: CLI absence claims vs. the latest runpodctl release
        run: python3 hooks/check_cli_absence_claims.py --live
      - name: Check out runpod-mcp
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: runpod/runpod-mcp
          path: runpod-mcp
      - name: MCP tool names vs. runpod-mcp main
        if: ${{ !cancelled() }}
        run: |
          pip install pyyaml==6.0.3
          python3 hooks/check_skill_lint.py --refresh runpod-mcp
          git --no-pager diff -- testdata/runpod-mcp/tools.json
          python3 hooks/check_skill_lint.py --self-test
          python3 hooks/check_skill_lint.py

name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate marketplace manifests
        run: python3 hooks/validate_marketplace.py
      - name: Check manifest versions agree
        run: python3 hooks/check_versions.py
      - name: Check Runpod branding
        run: python3 hooks/check_runpod_branding.py
      - name: Check skill and command frontmatter parses
        run: |
          pip install pyyaml==6.0.3
          python3 hooks/check_frontmatter.py --self-test
          python3 hooks/check_frontmatter.py
      - name: Check Markdown links
        run: python3 hooks/check_links.py
      - name: Check CLI absence claims against the vendored runpodctl surface
        run: |
          python3 hooks/check_cli_absence_claims.py --self-test
          python3 hooks/check_cli_absence_claims.py
      - name: Check runpod-migrate scanner against its corpora
        run: python3 hooks/check_migrate_scanner.py
      - name: Check runpod-migrate path tables against the spec snapshot
        run: python3 hooks/check_migrate_tables.py
      - name: Check runpod-migrate Class-3 table against the spec snapshot
        run: python3 hooks/check_migrate_class3.py
      - name: Test ComfyUI workflow model metadata helpers
        run: python3 -B -m unittest discover -s plugins/runpod/skills/runpod-templates/tests -p "test_*.py"
      - name: Test runpod-migrate scanner helpers
        run: python3 -B -m unittest discover -s plugins/runpod/skills/runpod-migrate/tests -p "test_*.py"

  skill-scripts-oldest-python:
    # The skill scripts run on users' machines with whatever `python3` they have,
    # so their tests also run on the oldest version we support: 3.9, the macOS
    # system python3. The validate job above only proves they work on 3.14.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test ComfyUI workflow model metadata helpers
        run: python3 -B -m unittest discover -s plugins/runpod/skills/runpod-templates/tests -p "test_*.py"
      - name: Test runpod-migrate scanner helpers
        run: python3 -B -m unittest discover -s plugins/runpod/skills/runpod-migrate/tests -p "test_*.py"

  concepts:
    # The concept files under runpod-usage/concepts: schema, cross-file refs,
    # REST v2 snapshot, public-only wording, and that every cited skill file exists.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ontology/tools
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ontology/tools/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm validate --strict
      - run: pnpm check:guides
      - run: pnpm build:sqlite
      - name: Pack @runpod/plugin-knowledge (what release-please publishes)
        working-directory: packages/knowledge
        run: npm pack --dry-run

  template-examples:
    # Small CPU fixtures only: no Runpod credentials, GPU, push or billable resources.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: [http, queue]
    defaults:
      run:
        working-directory: plugins/runpod/skills/runpod/golden-paths/26-template-project/template
    steps:
      - uses: actions/checkout@v4
      - name: Build and test application adapters in the image runtime
        run: |
          docker build --target test -f Dockerfile.${{ matrix.target }} -t template-example:test .
          docker run --rm template-example:test
          docker build -f Dockerfile.${{ matrix.target }} -t template-example:app .
      - name: Exercise actual HTTP entrypoint
        if: matrix.target == 'http'
        run: |
          docker run -d --name template-http -p 127.0.0.1:8080:8080 template-example:app
          python3 - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8080/ping', timeout=2) as response:
                      assert json.load(response) == {'status': 'ready'}
                  break
              except URLError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          request = Request('http://127.0.0.1:8080/analyze',
                            data=b'{"text":"A a B"}',
                            headers={'Content-Type': 'application/json'})
          with urlopen(request, timeout=5) as response:
              assert json.load(response) == {'words': 3, 'counts': {'a': 2, 'b': 1}}
          PY
      - name: Exercise queue SDK local-input mode
        if: matrix.target == 'queue'
        run: |
          python3 - <<'PY'
          import ast
          import json
          import subprocess

          command = ['docker', 'run', '--rm', 'template-example:app']
          # The bundled local request tests the actual default container command.
          result = subprocess.run(command,
                                  capture_output=True, text=True, check=True, timeout=120)
          print(result.stdout)
          # The example deliberately pins SDK 1.10.1; assert its actual result payload.
          payloads = [ast.literal_eval(line.split('Job result: ', 1)[1])
                      for line in result.stdout.splitlines() if 'Job result: ' in line]
          assert payloads == [{'output': {'words': 3, 'counts': {'a': 2, 'b': 1}}}]
          invalid = subprocess.run(command + ['python', '-u', 'handler.py', '--test_input',
                                             json.dumps({'input': {'text': ''}})],
                                   capture_output=True, text=True, check=False, timeout=120)
          assert invalid.returncode != 0
          assert 'text must be a non-empty string' in invalid.stdout + invalid.stderr
          PY
      - name: Clean up HTTP test container
        if: always() && matrix.target == 'http'
        run: docker rm -f template-http || true

  nix-checks:
    # Runs the full static-analysis gate (ruff, mypy, bandit, unittest,
    # shellcheck, shfmt, biome, nixfmt, deadnix, statix) hermetically. The
    # `validate` job above stays the source of truth for the domain-specific
    # hooks; this job adds lint/type/security/format/tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: nix flake check
        run: nix flake check --print-build-logs

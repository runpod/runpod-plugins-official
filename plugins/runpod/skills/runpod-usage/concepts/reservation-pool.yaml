id: reservation-pool
name: Reserved capacity
kind: billing
summary: >
  GPU capacity reserved for an account through Runpod's sales team, chosen as
  the Reserved pricing option instead of On-Demand when deploying a pod.
product: billing
is_a: null
part_of: runpod-platform
aliases: [reservation, reserved capacity, Reserved pricing]

surfaces:
  graphql: { type: Reservation }
  console: Pods

fields: []

relations:
  - { type: uses, target: gpu-type, cardinality: 1..n }

rules:
  - id: reservation-pool.not-self-serve
    statement: >
      Reserved capacity is arranged with Runpod's sales team, not created
      through the API. In the console's pod deploy flow, choosing the Reserved
      pricing option points to Talk to sales instead of deploying.
    status: documented
    evidence:
      - { source: public-docs, url: https://docs.runpod.io/get-started, seen: 2026-09-28 }

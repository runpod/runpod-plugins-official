id: instant-cluster
name: Instant Cluster
kind: resource
summary: >
  A group of identical GPU pods in one data center, connected by a private high-bandwidth
  network and set up for distributed training, Slurm, Ray or other multi-node workloads.
product: clusters
is_a: null
part_of: runpod-platform
aliases: [cluster, Instant Clusters, cluster node, Slurm cluster, Ray cluster]

surfaces:
  rest_v2:
    schema: Cluster
    paths: [/v2/clusters, "/v2/clusters/{id}", "/v2/clusters/{id}/pods"]
  graphql:
    mutations: [createCluster, deleteCluster]
  mcp: [create-cluster, list-clusters, get-cluster, update-cluster, delete-cluster, list-cluster-pods]
  runpodctl: []
  console: Instant Clusters

fields:
  - { name: name, type: string, set: "create,update", required: true }
  - { name: type, type: enum, values: [APPLICATION, TRAINING, SLURM, RAY], set: create, required: true }
  - { name: compute.gpuTypeId, type: string, ref: gpu-type, set: create, required: true }
  - { name: compute.gpuCountPerPod, type: integer, set: create, required: true, note: "1 to the GPU type's `maxCount`." }
  - { name: compute.podCount, type: integer, set: create, required: true, note: "2 to 250." }
  - { name: templateId, type: string, ref: template, set: create }
  - { name: dataCenterIds, type: "string[]", ref: data-center, set: create, note: "Placement preference." }
  - { name: dataCenterId, type: string, ref: data-center, set: read }
  - { name: "mounts.network[].volumeId", type: string, ref: network-volume, set: create }
  - { name: startSsh, type: boolean, set: create }
  - { name: pods, type: ClusterPodsSummary, set: read, note: "Counts only. List members with `GET /v2/clusters/{id}/pods`." }
  - { name: primary, type: ClusterPrimary, set: read }
  - { name: network, type: ClusterNetwork, set: read }

relations:
  - { type: runs_on, target: pod, cardinality: "1..n" }
  - { type: runs_on, target: gpu-type, cardinality: "1" }
  - { type: located_in, target: data-center, cardinality: "1" }
  - { type: uses, target: network-volume, cardinality: "0..1" }
  - { type: uses, target: template, cardinality: "0..1" }
  - { type: billed_by, target: billing-record, cardinality: "1" }

rules:
  - id: instant-cluster.fixed-at-create
    applies_to: [field:type, field:compute.gpuTypeId, field:compute.gpuCountPerPod, field:compute.podCount]
    statement: >
      `PATCH /v2/clusters/{id}` only renames a cluster. The type, GPU type, GPUs per pod and
      container settings are fixed at creation; to change them, delete the cluster and
      create a new one.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "PATCH /v2/clusters/{id}; UpdateClusterRequest", seen: 2026-09-28 }

  - id: instant-cluster.scale-in-console
    applies_to: [field:compute.podCount]
    statement: >
      Add pods to a running cluster from the console with **Scale cluster**; new pods use
      the same GPU type, template and network storage. REST v2 has no route that adds pods.
      To shrink a cluster, terminate the pods you no longer need from the console. Clusters
      on reserved hardware cannot be scaled this way.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/instant-clusters/scale-clusters" }
      - { source: rest-v2-spec, ref: "paths under /v2/clusters", seen: 2026-09-28, note: "No path adds pods to an existing cluster." }

  - id: instant-cluster.homogeneous-single-dc
    applies_to: [field:compute.podCount, field:compute.gpuCountPerPod, field:dataCenterIds]
    statement: >
      Every member pod is identical: `podCount` pods (2 to 250), each with `gpuCountPerPod`
      GPUs of `gpuTypeId`, up to the GPU type's `maxCount`. The whole cluster is placed in
      one data center.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "ClusterCompute; CreateClusterRequest.dataCenterIds", seen: 2026-09-28 }

  - id: instant-cluster.private-image-via-template
    applies_to: [field:templateId]
    statement: >
      A template is the only way to run a private image on a cluster; the create body has
      no registry field. `templateId` cannot be combined with `image`, `args`, `entrypoint`,
      `cmd`, `disk`, `env`, `ports` or `mounts`, and it must name a pod template, not a
      serverless one.
    on_violation: 400
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "CreateClusterRequest; CreateClusterRequest.templateId", seen: 2026-09-28 }

  - id: instant-cluster.members-managed-by-cluster
    applies_to: [field:pods]
    statement: >
      Member pods are left out of `GET /v2/pods` unless you pass `includeClusterPods=true`,
      and the pod endpoints cannot change or delete them. `DELETE /v2/clusters/{id}`
      terminates every member pod.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "Pod.cluster; DELETE /v2/clusters/{id}", seen: 2026-09-28 }

  - id: instant-cluster.primary-node
    applies_to: [field:primary]
    statement: >
      The primary node has `NODE_RANK` 0 and is the Slurm controller on Slurm clusters.
      Every member pod gets `NODE_RANK`, `PRIMARY_ADDR` and `PRIMARY_PORT` (also exposed as
      `MASTER_ADDR` and `MASTER_PORT`). `primary.sshEndpoint` appears only once the primary
      pod is `RUNNING` with `22/tcp` exposed.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "PodCluster.rank; ClusterPrimary.sshEndpoint", seen: 2026-09-28 }
      - { source: public-docs, url: "https://docs.runpod.io/instant-clusters/configuration" }
      - { source: public-docs, url: "https://docs.runpod.io/instant-clusters/slurm-clusters" }

  - id: instant-cluster.nccl-interface
    statement: >
      Set `NCCL_SOCKET_IFNAME=ens1` so NCCL uses the cluster's high-bandwidth interfaces
      (`ens1` to `ens8`). Traffic over the external `eth0` interface makes distributed
      training time out or hang.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/instant-clusters/configuration" }
      - { source: public-docs, url: "https://docs.runpod.io/instant-clusters/pytorch" }

  - id: instant-cluster.shared-volume-same-dc
    applies_to: ["field:mounts.network[].volumeId"]
    statement: A network volume shared by the cluster must be in the cluster's data center.
    status: documented
    see: [pod.network-volume-same-dc]
    evidence:
      - { source: rest-v2-spec, ref: NetworkMount.volumeId, seen: 2026-09-28 }

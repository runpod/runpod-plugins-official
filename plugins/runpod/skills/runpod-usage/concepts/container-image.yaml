id: container-image
name: Container image
kind: external
summary: >
  The Docker image a pod or Serverless worker runs, pulled from Docker Hub,
  GHCR, a private registry, or Runpod's registry for Hub builds.
product: templates
is_a: null
part_of: null
aliases: [image, imageName, Docker image, worker image, runpod/pytorch, runpod/base]

surfaces:
  console: Templates

relations:
  - { type: uses, target: registry-credential, cardinality: "0..1" }

rules:
  - id: container-image.use-runpod-pytorch
    statement: >
      Prefer an official Runpod image when it supplies the application's
      required framework and CUDA stack; otherwise use a compatible pinned base
      with an explicit runtime and dependency plan. Inspect the selected image
      and verify a representative workload, since an official image alone does
      not establish application or target GPU compatibility.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/building-images.md, note: Choose a compatible base. }

  - id: container-image.pin-exact-tag
    statement: >
      Record an exact published image tag and its resolved digest, along with
      the source revision, dependency locks or constraints, and model revision.
      Tags can move, and pinning a base image does not pin later downloads.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/building-images.md, note: Choose a compatible base. }

  - id: container-image.build-for-amd64
    statement: >
      Runpod hosts are x86_64. Build with `docker build --platform=linux/amd64`,
      especially on an Apple Silicon machine, or the image will not start.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/building-images.md }
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/docker.md }

  - id: container-image.ssh-on-custom-base
    statement: >
      A pod that promises SSH must preserve or implement the selected image's
      SSH startup and key handling. Some Runpod bases provide `/start.sh` and
      startup hooks; inspect the exact version before replacing its command.
      Application-only pods may use their own command without SSH or Jupyter.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/building-images.md, note: Match startup to the target. }
      - { source: skill, path: plugins/runpod/skills/runpod/golden-paths/22-minimal-pod-image/README.md }

  - id: container-image.layer-reuse
    statement: >
      Extending the same published dependency image preserves its existing
      layers, while independently reinstalling the same package versions does
      not establish identical layers. Host-cached layers can avoid transfer, but
      BuildKit's build cache and the deployment host's image cache are separate;
      measure layer identity, transfer and startup independently.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/building-images.md, note: Layer for reuse. }

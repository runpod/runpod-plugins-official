id: cpu-pod
name: CPU pod
kind: resource
summary: >
  A pod on CPU-only hardware, priced by vCPU. It has the same networking,
  storage options and lifecycle as a GPU pod, apart from the limits below.
product: pods
is_a: pod
part_of: null
aliases: [CPU-only pod, CPU instance]

surfaces:
  rest_v2: { schema: Pod, paths: [/v2/pods, /v2/catalog/cpus] }
  mcp: [create-pod, list-cpu-types, get-cpu-type]
  runpodctl: [pod create --compute-type cpu]
  console: Pods

fields:
  - { name: cpu, type: CreateCpuConfig, set: create, required: true }
  - { name: cpu.id, type: string, ref: cpu-flavor, set: create, required: true, note: "A CPU flavor id from `GET /v2/catalog/cpus`, for example `cpu5c`." }
  - { name: cpu.vcpuCount, type: integer, set: create, required: true, note: "A power of two, at least 2." }
  - { name: cpu.memory, type: integer, unit: GB, set: read, note: Derived from the flavor. }

relations:
  - { type: runs_on, target: cpu-flavor, cardinality: "1" }
  - { type: located_in, target: data-center, cardinality: "1" }
  - { type: billed_by, target: pod-billing, cardinality: "1" }

rules:
  - id: cpu-pod.flavor-and-vcpus
    applies_to: [field:cpu.id, field:cpu.vcpuCount, field:cpu.memory]
    statement: >
      A CPU pod takes a CPU flavor id in `cpu.id`, not a GPU type id, plus a
      `vcpuCount` for that flavor. Do not send memory; the API derives it from
      the flavor.
    status: documented
    see: [cpu-flavor.vcpu-power-of-two, cpu-flavor.memory-is-derived]
    evidence:
      - { source: rest-v2-spec, ref: CreatePodRequest; BaseCpuConfig; CpuConfig.memory, seen: 2026-09-28 }

  - id: cpu-pod.storage-limits
    applies_to: [field:cpu]
    statement: >
      CPU pods support the container disk and a network volume only. A
      persistent (host-local) mount is rejected.
    on_violation: 400
    status: documented
    see: [pod.persistent-mount-limits]
    evidence:
      - { source: rest-v2-spec, ref: CreatePodRequest, seen: 2026-09-28 }

  - id: cpu-pod.no-global-networking
    applies_to: [field:cpu]
    statement: >
      CPU pods cannot use global networking, which needs an NVIDIA GPU pod.
    status: documented
    see: [pod.global-networking-next-start]
    evidence:
      - { source: rest-v2-spec, ref: CreatePodRequest.globalNetworking, seen: 2026-09-28 }

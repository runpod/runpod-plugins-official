id: volume-cache
name: VolumeCache
kind: capability
summary: >
  A helper in the Runpod Python SDK that mirrors local directories, such as a
  model cache, onto the endpoint's network volume. On cold start it copies the
  mirror onto the worker's container disk, so the model loads from local disk
  instead of the network mount.
product: serverless
is_a: null
part_of: serverless-handler
aliases: [volume cache, network-volume warm cache, runpod.serverless.VolumeCache, hydrate, sync]

relations:
  - { type: requires, target: network-volume, cardinality: "1" }
  - { type: uses, target: container-disk, cardinality: "1" }

rules:
  - id: volume-cache.copy-to-local-disk
    statement: >
      `from runpod.serverless import VolumeCache` needs the Runpod Python SDK
      `runpod>=1.12.0` in the worker. Wrap the model load in `with
      VolumeCache(dirs=[<local cache dir>]):`. On entry it copies cached files
      from the volume into the local directories (`hydrate()`), and on exit it
      copies new or changed files back to the volume (`sync()`).
    status: documented
    see: [network-volume.mount-path]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14" }
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/main/CHANGELOG.md", seen: "2026-10-14", note: "1.12.0 adds the network-volume warm cache (VolumeCache)." }

  - id: volume-cache.local-dirs-not-the-mount
    statement: >
      List directories on the container disk in `dirs`, not paths under
      `/runpod-volume`. The volume holds only the mirror, so the model loads
      from local disk, and the files are re-hydrated after the container disk is
      wiped at scale-down.
    status: documented
    see: [container-disk.what-survives]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14", note: VolumeCache warms local directories using an attached network volume. }

  - id: volume-cache.opt-in-handler-code
    statement: >
      `VolumeCache` runs only where your handler code wraps it, so it applies to
      your own handler or Flash code. A prebuilt worker image that does not call
      it reads its model path directly, and a network volume attached to that
      image serves the model from the mount.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14", note: "You add it explicitly by wrapping the code that populates your cache, so nothing runs until you opt in." }

  - id: volume-cache.best-effort-hides-failures
    statement: >
      With the default `best_effort=True`, any cache error is logged and
      swallowed, and the worker falls back to a normal cold start. A failing
      cache therefore shows up as a slow cold start, not an error. Pass
      `best_effort=False` while debugging so failures raise.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14" }

  - id: volume-cache.symlinks-not-copied
    statement: >
      `VolumeCache` never copies symbolic links, and it skips `refs/` and
      `.no_exist/` directories and `*.lock` files. The `snapshots/` entries of a
      Hugging Face hub cache are symlinks, so after a hydrate let
      `huggingface_hub` re-link the snapshot with a Hub metadata call. Do not
      set `HF_HUB_OFFLINE=1` on a cache that `VolumeCache` restores.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14", note: Symbolic links are never followed or copied. }
      - { source: other, url: "https://huggingface.co/docs/huggingface_hub/guides/manage-cache", seen: "2026-10-14", note: Snapshot files are symlinks to blobs. }
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/v1.12.0/runpod/serverless/utils/rp_volume_cache.py#L74", seen: "2026-10-15", note: Paths containing /refs/ or /.no_exist/ are excluded from sync. }

  - id: volume-cache.container-disk-holds-cache
    statement: >
      The worker's container disk holds the whole local cache, because both the
      hydrate and a fallback Hub download write there. Size the container disk
      for the full model plus runtime headroom. Flash SDK resources default to
      30 GB on GPU, so raise it with `container_disk_gb=` (legacy `runpod-flash`
      endpoints default to 64 GB and use
      `template=PodTemplate(containerDiskInGb=...)`), and on a template use
      `runpodctl template create --container-disk-in-gb`.
    status: documented
    see: [container-disk.what-survives]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14", note: VolumeCache restores cached files into the local directories. }
      - { source: public-docs, url: "https://docs.runpod.io/sdk/configuration/parameters", seen: "2026-10-16", note: container_disk_gb defaults to 30 on GPU and 10 on CPU. }
      - { source: skill, path: plugins/runpod/skills/flash/reference/runpod-flash-legacy.md, note: PodTemplate containerDiskInGb defaults to 64. }
      - { source: skill, path: plugins/runpod/skills/runpodctl/SKILL.md }

  - id: volume-cache.silent-without-namespace
    statement: >
      `VolumeCache` needs a mounted volume and a `namespace`, which defaults to
      `RUNPOD_ENDPOINT_ID`. Without either, `available` is False and `hydrate()`
      and `sync()` do nothing and log nothing. Serverless workers set
      `RUNPOD_ENDPOINT_ID`, but a Pod or a local run does not, so pass
      `namespace=` there or check `available` before relying on the cache.
    status: documented
    evidence:
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/v1.12.0/runpod/serverless/utils/rp_volume_cache.py#L87", seen: "2026-10-15", note: "namespace falls back to RUNPOD_ENDPOINT_ID, then to an empty string." }
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/v1.12.0/runpod/serverless/utils/rp_volume_cache.py#L374", seen: "2026-10-15", note: "hydrate() and sync() return early when not available, with no log line." }

  - id: volume-cache.mirror-sizing
    statement: >
      The mirror lives at `/runpod-volume/.cache/<namespace>` and the
      `namespace` defaults to `RUNPOD_ENDPOINT_ID`. Size the network volume for
      the mirror plus anything else on it. Large files that you delete or rename
      locally stay on the volume, so usage grows as you swap model versions.
    status: documented
    see: [network-volume.size-grow-only]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14" }

  - id: volume-cache.first-population
    statement: >
      Workers that cold-start together against an empty mirror each download the
      model and sync a full copy back, with no coordination. Populate the mirror
      with one worker first. The default `sync()` runs on a background thread,
      so call `sync(background=False)` when the process may be killed before a
      normal interpreter shutdown.
    status: documented
    see: [network-volume.concurrent-writes]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/volume-cache", seen: "2026-10-14" }

  - id: volume-cache.restore-beats-mount-load
    statement: >
      A cold start that restores the model with `VolumeCache` and loads it from
      local disk is faster than loading it straight from the network volume or
      downloading it. Measured with Qwen2.5-1.5B (3.1 GB): restore 5.2 s plus
      load 3.9 s, against 11 s loading from the mount and 16-21 s downloading
      from Hugging Face and loading.
    status: verified
    evidence:
      - { source: live-probe, ref: "Runpod SDK app, Qwen2.5-1.5B-Instruct on L4/RTX 4090 workers: fresh-worker VolumeCache hydrate 5.2 s + load 3.9 s (3.10 GB restored); load from /runpod-volume 10.7-11.6 s; Hugging Face download + load 16.3-21.4 s", seen: "2026-10-17" }

  - id: volume-cache.global-volume
    statement: >
      `VolumeCache` mirrors onto a global volume mounted at its `volume_path`
      (`/runpod-volume` on a GPU endpoint). Use `runpod>=2.0.1`. Before
      2.0.0rc2, files of 256 KiB or more failed to copy onto a global volume.
      Before 2.0.1, a restore from a global volume could drop large files. Both
      failures are swallowed, so the worker downloads the model again. Restores
      that copied whole files took 26-51 s for 3.1 GB, against 5.2 s from a
      network volume. 2.0.1 restores files in parallel byte ranges and retries
      failed reads.
    status: verified
    see: [volume-cache.best-effort-hides-failures]
    evidence:
      - { source: live-probe, ref: "Runpod SDK app, Qwen2.5-1.5B-Instruct, GlobalVolume mounted at /runpod-volume: fresh-worker hydrate restored all 3.10 GB in 26.2 s, 46.6 s and 51.4 s", seen: "2026-10-17" }
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/fc4a6c73c3915625d65df63416db835d0b927b8f/runpod/serverless/utils/rp_volume_cache.py#L292", seen: "2026-10-22", note: "copy2 copies mtime and mode after the data; the global volume rejects utime/chmod, so big files failed to copy. The fix copies the data and treats the metadata step as optional." }
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/fc4a6c73c3915625d65df63416db835d0b927b8f/runpod/serverless/utils/rp_volume_cache.py#L389", seen: "2026-10-22", note: "Hydrate copies big files as parallel byte ranges and retries ENOMEM, EIO and EAGAIN reads, which a global volume returns under whole-file parallel copies." }

  - id: volume-cache.namespace-per-endpoint
    statement: >
      The mirror is keyed by `namespace`, which defaults to the endpoint ID.
      Each Runpod SDK dev session creates new endpoints, so it starts from an
      empty mirror and leaves its copy on the volume. Pass a fixed `namespace=`
      to share one mirror across dev sessions and deploys.
    status: documented
    see: [volume-cache.mirror-sizing, flash.dev-session]
    evidence:
      - { source: other, url: "https://github.com/runpod/runpod-python/blob/v1.12.0/runpod/serverless/utils/rp_volume_cache.py#L87", seen: "2026-10-15", note: namespace falls back to RUNPOD_ENDPOINT_ID. }
      - { source: public-docs, url: "https://docs.runpod.io/sdk/apps/dev-sessions", seen: "2026-10-16", note: Dev sessions create temporary endpoints and delete them when the session ends. }

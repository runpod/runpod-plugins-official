id: serverless-handler
name: Handler function
kind: capability
summary: >
  The code inside a worker image that receives each job's input and returns its
  output. A queue-based worker runs the Runpod SDK's handler loop, and a
  load-balanced worker runs its own HTTP server.
product: serverless
is_a: null
part_of: worker
aliases: [handler, handler.py, runpod.serverless.start, concurrent handler, worker contract]

relations:
  - { type: requires, target: container-image, cardinality: "1" }

rules:
  - id: serverless-handler.errors-become-failed
    statement: >
      When the handler raises an exception, the Runpod SDK marks the job
      `FAILED` and returns the exception details in the job's results; the
      caller does not get an HTTP 5xx. Return `{"error": "..."}` for a graceful
      failure, and avoid `try`/`except` blocks that hide errors.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/handler-functions", note: Error handling. }

  - id: serverless-handler.lb-vs-queue
    statement: >
      A load-balanced worker runs its own HTTP server on the port in `PORT`
      (default 80), with a health check on `PORT_HEALTH` at `HEALTH_CHECK_PATH`
      (default `/ping`). A queue-based worker calls `runpod.serverless.start`
      and receives jobs from the queue.
    status: documented
    see: [serverless-endpoint.lb-worker-ports]
    evidence:
      - { source: rest-v2-spec, ref: EndpointType, seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/serverless/load-balancing/overview" }

  - id: serverless-handler.generator-for-streaming
    statement: >
      Streaming needs a generator handler that yields output. Pass
      `return_aggregate_stream=True` to `runpod.serverless.start` to also return
      the full list from `/run`, `/runsync` and `/status`. A single chunk is
      capped at 1 MB.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/endpoint-workflows.md, note: Streaming section. }

  - id: serverless-handler.load-model-once
    statement: >
      Load the model at module level or once per worker, not inside the handler,
      so warm workers reuse it between jobs.
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/gotchas.md, note: Cold starts and timeouts. }
      - { source: skill, path: plugins/runpod/skills/flash/SKILL.md, note: Gotcha 11. }

  - id: serverless-handler.input-shape
    statement: >
      The handler receives the job's `input` object. The worker SDK rejects a
      job with an empty `input` ("Job has missing field(s): id or input").
    status: documented
    see: [job.input-envelope]
    evidence:
      - { source: skill, path: plugins/runpod/skills/flash/SKILL.md, note: Gotcha 10. }

  - id: serverless-handler.local-serve-flag
    statement: >
      Run `python handler.py --rp_serve_api` to serve a handler locally as an
      HTTP API for testing. Add `--rp_api_port` to change the port.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/local-testing" }

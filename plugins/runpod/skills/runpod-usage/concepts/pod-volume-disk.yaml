id: pod-volume-disk
name: Pod volume disk
kind: component
summary: >
  Persistent storage on the pod's own machine, mounted at `/workspace` by
  default. Only that pod can use it. It survives stops and restarts and is
  deleted when the pod is terminated. It is not a network volume, which lives at
  the data center level.
product: pods
is_a: null
part_of: pod
aliases: [volume disk, persistent mount, /workspace disk, pod volume, local volume, encrypted volume, volumeInGb]

surfaces:
  rest_v2: { schema: Pod }
  runpodctl: [pod create --volume-in-gb, pod create --volume-mount-path]
  console: Pods

fields:
  - { name: mounts.persistent.size, type: integer, unit: GB, set: create, note: Minimum 10. }
  - { name: mounts.persistent.path, type: string, set: "create,update", note: "Usually `/workspace`." }

relations:
  - { type: located_in, target: machine, cardinality: "1" }
  - { type: billed_by, target: pod-billing, cardinality: "1" }

rules:
  - id: pod-volume-disk.machine-level-not-data-center-level
    applies_to: ["field:mounts.persistent.size"]
    statement: >
      The volume disk lives on the pod's machine, not in the data center, and
      only that pod can use it. A network volume is the data-center-level
      storage that any pod or endpoint in the data center can attach. A pod
      mounts one or the other at `/workspace`, never both.
    status: documented
    see: [network-volume.data-center-level-not-machine-level, machine.host-local-storage]
    evidence:
      - { source: rest-v2-spec, ref: "PersistentMount; Mounts", seen: "2026-09-28", note: "The persistent mount is pinned to the pod's host machine, and it cannot be combined with a network mount." }
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types", seen: "2026-09-28", note: "A network volume replaces the volume disk at `/workspace`." }
      - { source: public-docs, url: "https://docs.runpod.io/pods/troubleshooting/zero-gpus", seen: "2026-09-28", note: "A stopped pod's volume storage remains on the physical machine." }

  - id: pod-volume-disk.lifetime-and-billing
    applies_to: ["field:mounts.persistent.size"]
    statement: >
      The volume disk survives stops and restarts and is deleted when the pod is
      terminated. It is billed while the pod runs and, at a higher rate, while
      the pod is stopped; billing ends when the pod is terminated.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types" }
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/storage.md }

  - id: pod-volume-disk.deprecated-prefer-network
    applies_to: ["field:mounts.persistent.size"]
    statement: >
      The volume disk is tied to one host and is lost if that host fails. REST
      v2 marks the persistent mount as deprecated; use a network volume for data
      you cannot recreate.
    status: documented
    see: [pod.persistent-mount-limits]
    evidence:
      - { source: rest-v2-spec, ref: PersistentMount, seen: "2026-09-28" }

  - id: pod-volume-disk.grow-only
    applies_to: ["field:mounts.persistent.size"]
    statement: >
      The volume disk can be increased but not decreased. Editing a running pod
      to resize it resets the pod.
    status: documented
    see: [pod.edits-apply-on-restart]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types", note: Modify storage capacity. }

  - id: pod-volume-disk.encryption
    statement: >
      The volume disk can be encrypted at rest by selecting **Encrypt volume**
      when you create the pod in the console. The key cannot be retrieved, you
      cannot bring your own key, and encryption does not apply to the container
      disk or network volumes. REST v2 has no encryption field.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types", note: Encrypted volumes. }
      - { source: rest-v2-spec, ref: PersistentMount, seen: "2026-09-28", note: Only size and path. }

  - id: pod-volume-disk.none-on-serverless
    statement: >
      Serverless workers have no volume disk. Their storage options are the
      container disk, network volumes and S3-compatible storage.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/storage/overview" }

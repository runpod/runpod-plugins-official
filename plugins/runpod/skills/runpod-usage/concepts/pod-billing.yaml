id: pod-billing
name: Pod billing
kind: billing
summary: >
  What GPU and CPU pods cost over time: compute while a pod runs, plus disk
  storage, including while it is stopped. History is reported per pod per time
  bucket.
product: billing
is_a: billing-record
part_of: null
aliases: [pod cost, costPerHr, adjustedCostPerHr]

surfaces:
  rest_v2: { schema: PodBillingRecord, paths: [/v2/billing/pods] }
  mcp: [list-pod-billing]
  runpodctl: [billing pods]

fields:
  - { name: podId, type: string, ref: pod, set: read }
  - { name: startTime, type: string, set: read }
  - { name: endTime, type: string, set: read }
  - { name: totalAmount, type: number, unit: USD, set: read }
  - { name: gpuAmount, type: number, unit: USD, set: read }
  - { name: cpuAmount, type: number, unit: USD, set: read }
  - { name: diskAmount, type: number, unit: USD, set: read }

relations:
  - { type: requires, target: pod, cardinality: "1" }

rules:
  - id: pod-billing.per-pod-per-bucket
    applies_to: ["field:podId"]
    statement: >
      Records cover GPU and CPU pods alike, one record per pod per bucket. Pass
      `podId` to narrow the results to one pod.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "PodBillingRecord.podId; GET /v2/billing/pods", seen: "2026-09-28" }

  - id: pod-billing.live-rate-is-pod-cost
    applies_to: ["field:totalAmount"]
    statement: >
      This route is history. A pod's current hourly compute rate is its `cost`
      field, which reads 0 while the pod is stopped even though its disk is
      still billed.
    status: documented
    see: [pod.cost-is-compute-only]
    evidence:
      - { source: rest-v2-spec, ref: "Pod.cost; GpuType.price", seen: "2026-09-28" }

  - id: pod-billing.stopped-disk-rate
    applies_to: ["field:diskAmount"]
    statement: >
      A stopped pod keeps paying for its volume disk, at a higher per-GB rate
      than while it runs; container disk is not billed while the pod is stopped.
      Terminate the pod, rather than stopping it, to end all charges.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/pricing", seen: "2026-09-28" }
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/storage.md }

  - id: pod-billing.per-second
    statement: >
      Pods are billed per second for compute and for container and volume disk.
      Hourly rates express the same price in a larger unit for readability.
      There is no charge for storage while the pod's host machine is
      unavailable.
    status: documented
    see: [network-volume-billing.price]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/overview", seen: "2026-10-06", note: Says pods are billed by the second. }
      - { source: public-docs, url: "https://docs.runpod.io/pods/pricing", seen: "2026-10-06", note: Says pods are billed per second. }
      - { source: public-docs, url: "https://docs.runpod.io/accounts-billing/billing", seen: "2026-10-06" }

  - id: pod-billing.deploy-needs-an-hour
    statement: >
      Deploying an on-demand pod requires a balance that covers at least one
      hour of the selected configuration. Add funds or pick a cheaper
      configuration if the deploy is refused.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/pricing", seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/accounts-billing/billing", seen: "2026-09-28" }

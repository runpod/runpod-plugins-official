id: container-disk
name: Container disk
kind: component
summary: >
  The pod's own writable filesystem, where installs, downloads and temporary
  files land unless they are written to a mount. Its size is the pod's `disk`
  field.
product: pods
is_a: null
part_of: pod
aliases: [ephemeral disk, container volume, local disk, containerDiskInGb]

surfaces:
  rest_v2: { schema: Pod }
  console: Pods

fields:
  - { name: disk, type: integer, unit: GB, set: "create,update", note: Minimum 1. }

relations:
  - { type: billed_by, target: pod-billing, cardinality: "1" }

rules:
  - id: container-disk.what-survives
    applies_to: ["field:disk"]
    statement: >
      The container disk is cleared when the pod stops, restarts, is reset by an
      edit, or is terminated. Keep anything you need in `/workspace` on the
      volume disk or on a network volume.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types", note: Container disk data is lost on stop and restart. }
      - { source: rest-v2-spec, ref: ContainerConfig.disk, seen: "2026-09-28", note: Wiped on restart. }
      - { source: skill, path: plugins/runpod/skills/runpod-usage/reference/storage.md }

  - id: container-disk.fastest-local-storage
    applies_to: ["field:disk"]
    statement: >
      The container disk is always local to the machine, in every data center.
      Where `/workspace` is network-backed, 512 MB direct writes measured
      2.4-4.1 GB/s on the container disk against 443-713 MB/s on `/workspace`.
      Install packages, build and keep scratch files on the container disk (for
      example `/root`, `/opt` or `/tmp`), and keep only what must survive a stop
      or restart in `/workspace`. Size the container disk for those installs.
    status: verified
    see: [pod-volume-disk.network-filesystem-backed, container-disk.what-survives]
    evidence:
      - { source: live-probe, ref: "ubuntu:22.04 GPU pods with a 10 GB volume disk and no network volume: findmnt showed / as a local overlay and /workspace as a fuse mount of the data center network filesystem (mfs#<dc>:9421[/podvolumes/<machine>/<pod>]) on an RTX 2000 Ada in EU-RO-1, an A40 in EU-SE-1 and an L4 in US-MO-2; EU-SE-1 and US-MO-2 list storageSupport false. dd 512 MB oflag=direct: /workspace 713, 443 and 568 MB/s; container disk 2.8, 4.1 and 2.4 GB/s", seen: "2026-10-26" }

  - id: container-disk.billing
    applies_to: ["field:disk"]
    statement: >
      The container disk is billed per GB while the pod runs. On Serverless,
      each worker's container disk is billed in 5-minute intervals.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types" }
      - { source: public-docs, url: "https://docs.runpod.io/serverless/pricing" }

  - id: container-disk.resize
    applies_to: ["field:disk"]
    statement: >
      `disk` can be changed on an existing pod, but that edit resets a running
      pod. Size the disk for model downloads at create time.
    status: documented
    see: [pod.edits-apply-on-restart]
    evidence:
      - { source: rest-v2-spec, ref: UpdatePodRequest.disk, seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/pods/storage/types", note: Modify storage capacity. }

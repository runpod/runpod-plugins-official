id: endpoint-build
name: Endpoint build
kind: component
summary: >
  A container image build that Runpod runs from a commit to a GitHub repository
  connected to an endpoint. A completed build produces a release.
product: serverless
is_a: null
part_of: serverless-endpoint
aliases: [build, GitHub build, GitHub integration build]

surfaces:
  rest_v2: { schema: Build, paths: ["/v2/serverless/{id}/builds", "/v2/serverless/{id}/builds/{buildId}"] }
  mcp: [list-endpoint-builds, get-endpoint-build]
  console: Serverless > Builds

fields:
  - { name: id, type: string, set: read }
  - { name: status, type: BuildState, set: read }
  - { name: commitHash, type: string, set: read }
  - { name: branch, type: string, set: read }
  - { name: imageName, type: string, ref: container-image, set: read }
  - { name: error, type: string, set: read, note: "set for `FAILED` and `TEST_FAILED`" }
  - { name: startedAt, type: string, set: read }
  - { name: completedAt, type: string, set: read }

states:
  field: status
  values:
    PENDING: Queued and not started.
    BUILDING: Building the image.
    UPLOADING: Pushing the image.
    TESTING: Running tests.
    COMPLETED: Finished; the image was produced.
    FAILED: The build failed.
    CANCELLED: The build was cancelled.
    TEST_FAILED: The tests failed.
  evidence:
    - { source: rest-v2-spec, ref: BuildState, seen: "2026-09-28" }

relations:
  - { type: requires, target: container-image, cardinality: "1" }

rules:
  - id: endpoint-build.terminal-states
    applies_to: ["field:status", "field:error"]
    statement: >
      `COMPLETED`, `FAILED`, `CANCELLED` and `TEST_FAILED` are terminal.
      `PENDING`, `BUILDING`, `UPLOADING` and `TESTING` mean the build is still
      running. `error` explains a `FAILED` or `TEST_FAILED` build.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "BuildState; Build.error", seen: "2026-09-28" }

  - id: endpoint-build.feeds-release
    statement: >
      A completed build produces a release with `source` set to `GIT_BUILD` and
      its `buildId`. Workers move to it as they are replaced.
    status: documented
    see: [endpoint-release.source, endpoint-release.rollout]
    evidence:
      - { source: rest-v2-spec, ref: Release.buildId, seen: "2026-09-28" }

  - id: endpoint-build.listing
    statement: >
      The build list is newest first, with a default limit of 100. Fetch an
      older build directly by its id.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "GET /v2/serverless/{id}/builds; GET /v2/serverless/{id}/builds/{buildId}", seen: "2026-09-28" }

  - id: endpoint-build.github-targets
    statement: >
      The managed GitHub integration builds workers for queue-based and
      load-balanced Serverless endpoints. A connected GitHub account and App
      control repository access, and the setup selects a branch and Dockerfile
      path.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/github-integration.md, note: Documented behavior table. }

  - id: endpoint-build.github-budgets
    statement: >
      The managed GitHub route limits the Docker build step to 30 minutes, the
      total clone/build/upload/test process to 160 minutes, and image size to 80
      GB. These are limits of that route; diagnose the failing phase before
      changing model delivery or selecting another builder.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/github-integration.md, note: Documented behavior table. }

  - id: endpoint-build.github-public-base
    statement: >
      The managed GitHub builder does not support private base images. Use an
      authorized public base or an external builder and registry when the
      project requires a private base.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }

  - id: endpoint-build.github-build-gpu
    statement: >
      The managed GitHub builder does not provide GPU access during a build. A
      build that requires a GPU needs another builder; device-independent CUDA
      compilation does not itself require GPU access.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/github-integration.md, note: Documented behavior table. }

  - id: endpoint-build.github-image-export
    statement: >
      Images produced by the managed GitHub integration cannot be pulled or
      executed on other platforms. Use an external registry route when the
      project needs a portable image or local testing of that exact artifact.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }

  - id: endpoint-build.github-update-trigger
    statement: >
      Updating an existing GitHub integration requires a new GitHub release;
      pushing a commit alone does not complete deployment. Verify the build,
      release and worker image after publishing the release.
    status: documented
    see: [endpoint-build.feeds-release, endpoint-release.rollout]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/github-integration.md, note: Documented behavior table. }

  - id: endpoint-build.github-account-connection
    statement: >
      A Runpod account supports one GitHub connection, and connections are not
      shared. Check the owning account and repository access before planning a
      team or organization build.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/workers/github-integration", seen: "2026-10-10" }

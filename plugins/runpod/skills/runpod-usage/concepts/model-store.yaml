id: model-store
name: Model Store
kind: capability
summary: >
  Runpod-managed caching of model weights on hosts, so Serverless workers start
  with the model already present. Attach a Hugging Face model by URL, or upload
  your own model to the Model Repository.
product: storage
is_a: null
part_of: runpod-platform
aliases: [cached models, model cache, model weights, modelReferences, Model Repository]

surfaces:
  runpodctl: [model add, model list, model remove, serverless create --model-reference, serverless update --model-reference, serverless model-status]

relations:
  - { type: uses, target: serverless-endpoint, cardinality: "0..n" }
  - { type: uses, target: network-volume, cardinality: "0..1" }

rules:
  - id: model-store.attach-by-reference
    statement: >
      Attach a Hugging Face model to an endpoint by its full URL with a ref, for
      example `https://huggingface.co/<org>/<model>:main`. Public, gated and
      private models all work; gated and private ones need a Hugging Face token.
      Workers find the model in the standard Hugging Face cache under
      `/runpod-volume/huggingface-cache/hub/`.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-09-28" }
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

  - id: model-store.gpu-endpoints-only
    statement: >
      `runpodctl serverless create --model-reference` works with `--template-id`
      and `--hub-id` on GPU endpoints only (`--compute-type GPU`).
    status: documented
    evidence:
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

  - id: model-store.no-download-billing
    statement: >
      Model download time is not billed, whether or not the cache hits. On a
      miss, worker start is held until the download finishes, so jobs wait in
      the queue and the endpoint can look stuck while it downloads.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-09-28" }
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

  - id: model-store.best-effort-locality
    statement: >
      The scheduler prefers hosts that already hold the model, but residency is
      best-effort. Cache capacity depends on each machine's disk, so two workers
      on one endpoint can cold-start at different speeds. For a
      latency-sensitive endpoint, pre-load the weights on a network volume
      instead.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-09-28" }
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

  - id: model-store.not-on-hugging-face
    statement: >
      For a private model that is not on Hugging Face, upload it to the Model
      Repository with `runpodctl model add`, or bake it into the image.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-09-28" }
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

  - id: model-store.deployment-routes
    statement: >
      Hugging Face model caching can be configured for Docker, GitHub and Hub
      Serverless deployments. Choosing the managed GitHub builder does not
      require baking eligible model weights into its image.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/model-delivery.md, note: Delivery choices and documented cache constraints. }

  - id: model-store.one-model-per-endpoint
    statement: >
      An endpoint supports one cached model. An adapter and a separate base can
      require different repositories, so account for every required component
      instead of assuming caching one also supplies the other.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-10-10" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/model-delivery.md, note: Delivery choices and documented cache constraints. }

  - id: model-store.all-quantization-variants
    statement: >
      When a Hugging Face repository contains several quantization variants,
      Model Store downloads all of them. Account for the whole repository's
      download size and cache-miss startup time, not just the variant the
      application loads.
    status: documented
    see: [model-store.no-download-billing]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-10-14", note: Cached-model limitations. }

  - id: model-store.custom-loader-integration
    statement: >
      A custom worker must configure its loader's cache directory or pass the
      matching local snapshot; using a Hugging Face-compatible library alone
      does not establish cache discovery. Match the repository and revision,
      validate the loader's handling of cache symlinks, and keep writes in
      designated writable storage rather than the provider cache.
    status: documented
    see: [model-store.attach-by-reference]
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-10-13" }
      - { source: public-docs, url: "https://docs.runpod.io/serverless/development/huggingface-models", seen: "2026-10-13" }
      - { source: skill, path: plugins/runpod/skills/runpod-build-template/reference/model-delivery.md, note: Connect configuration to the loader. }

  - id: model-store.flash-attach-after-deploy
    statement: >
      For a Flash endpoint, attach the model after `flash deploy` with
      `runpodctl serverless update <endpoint-id> --model-reference <url>:<ref>`,
      which prints the saved `modelReferences`. Later `flash deploy` runs keep
      the reference. Point `HF_HUB_CACHE` at
      `/runpod-volume/huggingface-cache/hub` so the load finds it.
    status: verified
    see: [model-store.attach-by-reference, model-store.best-effort-locality]
    evidence:
      - { source: live-probe, ref: "runpodctl 2.14.0 serverless update --model-reference on a runpod-flash 1.20.1 endpoint, then flash deploy with a changed env; GraphQL myself.endpoints.modelReferences kept the reference", seen: "2026-10-14" }
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/model-caching", seen: "2026-10-14", note: Cached models are under /runpod-volume/huggingface-cache/hub/. }
      - { source: skill, path: plugins/runpod/skills/runpodctl/reference/model-caching.md }

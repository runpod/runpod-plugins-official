id: registry-credential
name: Container registry credential
kind: resource
summary: >
  A saved username and password for a private container registry such as Docker
  Hub, GHCR, GCR or ECR. Pods, templates and endpoints reference it by id to
  pull private images.
product: templates
is_a: null
part_of: runpod-platform
aliases: [registry auth, containerRegistryAuthId, ContainerRegistryAuth, ECR credential, ECR delegation]

surfaces:
  rest_v2: { schema: Registry, paths: [/v2/registries, "/v2/registries/{id}", /v2/registries/delegations, "/v2/registries/delegations/{id}"] }
  graphql: { type: ContainerRegistryAuth, queries: [getEcrLogin, getDelegations], mutations: [saveRegistryAuth, registerDelegation, revokeDelegation, attemptDelegation] }
  mcp: [create-registry, list-registries, get-registry, delete-registry, create-delegation, list-delegations, revoke-delegation]
  runpodctl: [registry create, registry list, registry get, registry delete]
  console: Settings

fields:
  - { name: id, type: string, set: read }
  - { name: name, type: string, set: create, required: true, note: "1-191 characters" }
  - { name: username, type: string, set: create, required: true, note: write-only }
  - { name: password, type: string, set: create, required: true, note: write-only }

relations: []

rules:
  - id: registry-credential.write-only
    applies_to: ["field:username", "field:password"]
    statement: >
      `username` and `password` are write-only and never returned by a read.
      REST v2 has no update for a credential, so to change one, create a new
      credential and point its users at it.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "CreateRegistryRequest; GET /v2/registries/{id}", seen: "2026-09-28" }

  - id: registry-credential.delete-in-use
    statement: >
      Deleting a credential fails while a pod uses it to pull its image.
      Templates are not checked: a template that references the credential loses
      it (`registry` becomes null), and its next deploy of a private image fails
      to pull.
    on_violation: 400 Registry credential is in use by a pod and cannot be deleted
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "DELETE /v2/registries/{id}", seen: "2026-09-28" }

  - id: registry-credential.ecr-delegation
    statement: >
      For Amazon ECR, register a delegation with the repository's ECR resource
      ARN (`POST /v2/registries/delegations`) instead of storing a password.
      List delegations with `GET /v2/registries/delegations` and revoke one with
      `DELETE /v2/registries/delegations/{id}`.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "CreateDelegationRequest; EcrDelegation", seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/api-reference-v2/registries/register-an-ecr-delegation", seen: "2026-09-28" }

id: flashboot
name: FlashBoot
kind: capability
summary: >
  An endpoint setting that keeps a worker's state on its host after the worker
  scales down, so it can start again faster than after a fresh cold start.
product: serverless
is_a: null
part_of: serverless-endpoint
aliases: [FlashBoot, Priority FlashBoot, flashBootType]

surfaces:
  mcp: [create-endpoint, update-endpoint]
  runpodctl: [serverless create]
  console: Serverless > Edit endpoint > FlashBoot

relations:
  - { type: requires, target: worker, cardinality: "1" }

rules:
  - id: flashboot.modes
    statement: >
      `flashboot` is `OFF`, `FLASHBOOT` or `PRIORITY_FLASHBOOT`, not a boolean.
      REST v2 create defaults to `OFF`, while new endpoints made in the console
      have FlashBoot on. An endpoint created over REST without it simply
      cold-starts more slowly.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "FlashBoot; CreateEndpointRequest.flashboot", seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/endpoint-configurations", note: FlashBoot section. }
      - { source: skill, path: plugins/runpod/skills/runpod-migrate/reference/breaking-changes.md, note: "Explains that `flashboot` changed from a boolean to an enum." }

  - id: flashboot.best-effort
    statement: >
      FlashBoot revives a worker from state retained after it scaled down. When
      no retained state is available, the worker cold-starts normally, so
      FlashBoot shortens starts without guaranteeing them. It helps most on
      endpoints with steady traffic, where workers often cycle between active
      and idle.
    status: documented
    evidence:
      - { source: public-docs, url: "https://docs.runpod.io/serverless/endpoints/endpoint-configurations", note: FlashBoot section. }

  - id: flashboot.flash-sdk-default-on
    statement: >
      The Flash SDK exposes FlashBoot as the `flashboot` argument of `Endpoint`,
      and it defaults to `True`. FlashBoot itself is an endpoint setting, not
      part of Flash.
    status: documented
    see: [flash.not-flashboot]
    evidence:
      - { source: skill, path: plugins/runpod/skills/flash/reference/api.md, note: Endpoint constructor. }

id: runpod-secret
name: Runpod Secret
kind: resource
summary: >
  An encrypted string stored on your account or team, such as an API token or
  password. You reference it from pod, endpoint or template environment
  variables, and Runpod substitutes the value when the pod or worker boots.
product: account
is_a: null
part_of: runpod-platform
aliases: [secret, RUNPOD_SECRET_, secrets, stored secret, secret environment variable, store a token]

surfaces:
  rest_v2: { schema: Secret, paths: [/v2/account/secrets, "/v2/account/secrets/{id}"] }
  graphql: { queries: [secret, secrets], mutations: [secretCreate, secretValueUpdate, secretDescriptionUpdate, secretDelete] }
  mcp: [create-secret, list-secrets, get-secret, update-secret, delete-secret]
  console: Secrets

fields:
  - { name: id, type: string, set: read }
  - { name: name, type: string, set: create, required: true, note: "unique, immutable, 1-191 characters" }
  - { name: value, type: string, set: "create,update", required: true, note: "write-only, under 16 MiB" }
  - { name: description, type: string, set: "create,update", note: "up to 65,535 bytes; send an empty string to clear" }
  - { name: createdAt, type: string, set: read }
  - { name: valueLastUpdatedAt, type: string, set: read }

relations:
  - { type: uses, target: template, cardinality: "0..n" }

rules:
  - id: runpod-secret.reference-syntax
    applies_to: ["field:name"]
    statement: >
      Set an environment variable's value to `{{ RUNPOD_SECRET_<name> }}` on a
      pod, endpoint or template. Runpod substitutes the stored value when the
      pod or worker boots, so the plain value never appears in the
      configuration.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: Secret, seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/pods/templates/secrets", seen: "2026-09-28" }

  - id: runpod-secret.value-write-only
    applies_to: ["field:value"]
    statement: >
      The value is never returned by the API or shown in the console after it is
      set. Keep your own copy if you will need it again.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: Secret, seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/pods/templates/secrets", seen: "2026-09-28" }

  - id: runpod-secret.name-rules
    applies_to: ["field:name"]
    statement: >
      `name` is unique in the account and cannot be changed. It is up to 191
      characters, starts with a letter or underscore, and uses letters, digits
      and `_.-/`. Names starting with `RUNPOD`, in any case, are rejected.
    on_violation: 409 name taken; 400 or 422 invalid name
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "CreateSecretRequest.name; POST /v2/account/secrets", seen: "2026-09-28" }

  - id: runpod-secret.rotation-next-boot
    applies_to: ["field:value"]
    statement: >
      A new value reaches pods and workers at their next boot. Running instances
      keep the value they started with, so restart them to pick up a rotation.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "PATCH /v2/account/secrets/{id}", seen: "2026-09-28" }

  - id: runpod-secret.patch-not-atomic
    applies_to: ["field:value", "field:description"]
    statement: >
      When a `PATCH` sends both `value` and `description`, the value is applied
      first. If the description update then fails, the response is an error but
      the new value has already taken effect. Send the two fields in separate
      requests when that matters.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "PATCH /v2/account/secrets/{id}", seen: "2026-09-28" }

  - id: runpod-secret.delete-breaks-references
    statement: >
      Deleting a secret is permanent and is not blocked while the secret is in
      use. Environment variables that reference it stop resolving, so update
      those references before you delete it.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: "DELETE /v2/account/secrets/{id}", seen: "2026-09-28" }

  - id: runpod-secret.api-routes
    statement: >
      Manage secrets through REST v2 at `/v2/account/secrets`, through the
      Runpod MCP secret tools, or in the console's Secrets page.
    status: documented
    evidence:
      - { source: rest-v2-spec, ref: /v2/account/secrets, seen: "2026-09-28" }
      - { source: public-docs, url: "https://docs.runpod.io/pods/templates/secrets", seen: "2026-09-28" }
